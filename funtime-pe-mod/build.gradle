plugins {
    id "fabric-loom" version "1.8-SNAPSHOT"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "ViaVersion"
        url = uri("https://repo.viaversion.com/")
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // ViaFabricPlus 3.6.1 is the last line that targets the 1.21.4 client.
    // The published jar bundles its ViaBedrock transport and Microsoft login dependencies.
    implementation files("libs/ViaFabricPlus-${project.viafabricplus_version}.jar")
    implementation files("libs/ViaBedrock-0.0.14.jar")
    implementation files("libs/viaversion-common.jar")
    implementation files("libs/MinecraftAuth.jar")
    modImplementation files("libs/ViaFabricPlus-${project.viafabricplus_version}.jar")
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from(sourceSets.main.output)
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

remapJar {
    dependsOn(jar)
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}